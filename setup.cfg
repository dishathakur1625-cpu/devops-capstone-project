[nosetests]
  where=tests
    nocapture=1
    cover-package=service
    with-coverage=1
    [coverage:run]
    source=service
    branch=True
    [flake8]
    max-line-length = 88
    exclude = .git,__pycache__,env,venv
    [tool:pylint]
    load-plugins=pylint_flask
    ignore=tests
    max-line-length=88
